name: CI

on:
  pull_request:
  push:
    branches: [bootstrap/base]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check src tools tests
      - name: Ruff format check
        run: uv run ruff format --check src tools tests

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run python -m pyright src tools tests

  schema:
    name: schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked
      - name: Repository + schema contracts
        run: uv run python tools/validate_repo.py

  unit:
    name: unit
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - name: Unit tests
        env:
          PYTHONPATH: src
        run: uv run python -m unittest discover -s tests -v

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked
      - name: Required browser runtime (no npm dependencies)
        run: |
          node --version
          node -e 'if (typeof WebSocket !== "function") process.exit(1)'
          google-chrome --version
      - name: Builder to SQLite to HTTP to mobile browser
        run: uv run python tools/browser_dashboard_smoke.py

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run python -m pip_audit

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Quét bí mật trên toàn lịch sử
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  status-freshness:
    name: status-freshness
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked
      - name: PROJECT-STATUS.md khớp git thật
        run: uv run python tools/check_status_freshness.py

  quality:
    name: quality
    if: always()
    needs: [static, typecheck, schema, unit, browser, dependency-audit, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Mọi cổng con phải thành công
        env:
          STATIC: ${{ needs.static.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          SCHEMA: ${{ needs.schema.result }}
          UNIT: ${{ needs.unit.result }}
          BROWSER: ${{ needs.browser.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
          AUDIT: ${{ needs.audit.result }}
        run: |
          for result in "$STATIC" "$TYPECHECK" "$SCHEMA" "$UNIT" "$BROWSER" "$DEPENDENCY_AUDIT" "$AUDIT"; do
            if [ "$result" != "success" ]; then
              echo "Cổng con chưa xanh" >&2
              exit 1
            fi
          done

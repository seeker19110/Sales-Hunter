name: Scheduled dependency audit

# Lỗ hổng mới có thể xuất hiện khi lockfile không đổi (TRAPS 2026-10-09); CI theo push/PR
# không thấy cho tới PR kế tiếp. Job này chỉ đọc, không tạo PR hay side effect.

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  dependency-audit:
    name: dependency-audit (bootstrap/base)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: bootstrap/base
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run python -m pip_audit

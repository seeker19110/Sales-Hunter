[project]
name = "sales-hunter"
version = "0.1.0"
description = "Khung phát triển hệ thống săn sale và affiliate đa nền tảng (subdomain donghanhcungban.org)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema[format-nongpl]>=4.26.0"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/s_n_sales"]

[dependency-groups]
dev = [
    "pip-audit>=2.10.1",
    "pyright>=1.1.414",
    "ruff==0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["src", "tools", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
